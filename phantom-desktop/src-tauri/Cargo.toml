[package]
name = "phantom-desktop"
version = "1.0.0"
description = "PhantomMirror Desktop Core"
authors = ["liyemenOX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
mdns-sd = "0.11"
crossbeam-channel = "0.5"
byteorder = "1.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
