<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#141f29" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ffaa" />
      <stop offset="100%" stop-color="#00e655" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Phone Silhouette -->
  <rect x="156" y="66" width="200" height="380" rx="36" fill="url(#phoneGrad)" stroke="#3a4b5d" stroke-width="4" />

  <!-- Dynamic Island -->
  <rect x="231" y="80" width="50" height="10" rx="5" fill="#1b242e" />

  <!-- Home Indicator Bar -->
  <rect x="221" y="428" width="70" height="4" rx="2" fill="#5c6f84" />

  <!-- Electric Bolt -->
  <path d="M 266 160 L 205 275 L 250 275 L 236 360 L 315 240 L 270 240 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
